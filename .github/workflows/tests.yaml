name: Run tests

on:
  push:

jobs:
  tests:
    name: Run the tests
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install bats-core ffmpeg gifsicle imagemagick yq

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Configure pip caching
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check versions
        run: |
          python --version
          python -c "import platform; print('Arch:', platform.machine())"
          python -c "import PIL; print('Pillow:', PIL.__version__)"
          python -c "import PIL; print('Location:', PIL.__file__)"
          python -c "from PIL import features; print('FreeType:', features.version('freetype2'))"
          python -c "from PIL import features; print('HarfBuzz:', features.version('harfbuzz'))"

      - name: Download test video
        run: |
          mkdir -p videos
          curl -o videos/HU2ftCitvyQ.mp4 https://bumph.cackhanded.net/HU2ftCitvyQ.mp4

      - name: Run tests
        run: |
          make test

      - name: Upload failed test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-tests
          path: temp/
